name: duolingo_wichi
description: "Aplicacion interactiva para aprender idioma Wichi de Fortin Dragones"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  image_picker: ^1.1.2 # Manejo de fotos y archivos de imagen
  record: 7.1.2      # Grabación de voz multiplataforma
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/caratula.png

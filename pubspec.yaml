name: duolingo_wichi
description: "Aplicacion interactiva para aprender idioma Wichi de Fortin Dragones"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  image_picker: ^1.1.2 # Manejo de fotos y archivos de imagen
  record: ^5.1.2       # Grabación de voz multiplataforma
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/caratula.png

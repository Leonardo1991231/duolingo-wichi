# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restaurar la firma de Android registrada en Firebase
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_DEBUG_KEYSTORE_BASE64 en GitHub."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: flutter pub get
      - name: Elegir número incremental para Android
        id: android_version
        run: echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
      - name: Compilar web y APK
        run: |
          flutter build web --release --base-href "/"
          flutter build apk --release --build-number=${{ steps.android_version.outputs.code }}
          mkdir -p build/web/updates
          cp build/app/outputs/flutter-apk/app-release.apk build/web/updates/app-release.apk
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WICHI_FACIL }}
          channelId: live
          projectId: wichi-facil

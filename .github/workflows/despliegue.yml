name: Despliegue Automático Wichí Fácil

on:
  push:
    branches:
      - main # Se activa cada vez que mandas cambios a la rama principal

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v7

      - name: 🛠️ Configurar entorno de Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🚀 Configurar Flutter en la nube
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Descargar librerías del proyecto
        run: flutter pub get

      - name: 💻 Compilar aplicación para la Web
        run: flutter build web --base-href "/duolingo-wichi/"

      - name: 🌐 Poner en línea en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages # Sube el resultado directo a la rama de internet
